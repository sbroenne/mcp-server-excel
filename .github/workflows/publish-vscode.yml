name: Publish VS Code Marketplace

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string
      package_artifact:
        required: true
        type: string
    secrets:
      VSCE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing source release tag to publish or repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-vscode
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Exact Release VSIX Packages
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve exact published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.release_commit }}
          EXPECTED_VERSION: ${{ inputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'An existing stable release tag is required.'
          }
          $commit = git rev-parse "refs/tags/$env:TAG^{commit}"
          git merge-base --is-ancestor $commit origin/main
          $version = $env:TAG.Substring(1)
          if ($env:EXPECTED_COMMIT -and $commit -ne $env:EXPECTED_COMMIT) { throw 'Release commit mismatch.' }
          if ($env:EXPECTED_VERSION -and $version -ne $env:EXPECTED_VERSION) { throw 'Release version mismatch.' }
          $release = gh release view $env:TAG --json isDraft,assets | ConvertFrom-Json
          if ($release.isDraft) { throw 'Draft releases cannot be published.' }
          foreach ($name in @("excel-mcp-$version.vsix", "excel-mcp-$version-win32-arm64.vsix")) {
            if ($name -notin $release.assets.name) { throw "Release is missing $name." }
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Checkout exact released publishing tools
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked extension publishing tools
        working-directory: vscode-extension
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --ignore-scripts
      - name: Download prepared release packages
        if: inputs.package_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.package_artifact }}
          path: artifacts
      - name: Download existing release packages for repair
        if: inputs.package_artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          gh release download $env:TAG --pattern "excel-mcp-$env:VERSION.vsix" --pattern "excel-mcp-$env:VERSION-win32-arm64.vsix" --dir artifacts
      - name: Publish Windows x64 extension
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm exec --no -- vsce publish --packagePath "../artifacts/excel-mcp-$env:VERSION.vsix" --skip-duplicate
      - name: Publish Windows ARM64 extension
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm exec --no -- vsce publish --packagePath "../artifacts/excel-mcp-$env:VERSION-win32-arm64.vsix" --skip-duplicate
