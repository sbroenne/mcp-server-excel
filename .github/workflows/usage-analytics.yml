name: Weekly Usage Analytics

on:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - '.github/workflows/usage-analytics.yml'
      - 'scripts/*UsageAnalytics*.ps1'
      - 'gh-pages/**'
      - '.github/usage-analytics.json'
      - '.github/usage-analytics-weights.json'
  workflow_dispatch:
    inputs:
      publish:
        description: Persist the validated report to analytics-data
        required: true
        type: boolean
        default: false

concurrency:
  group: usage-analytics
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test analytics privacy gates
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test analytics scripts
        shell: pwsh
        run: ./scripts/Test-UsageAnalytics.ps1

  collect:
    name: Collect sanitized aggregates
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Query sanitized aggregate telemetry
        shell: pwsh
        run: |
          $workspaceId = az monitor log-analytics workspace show `
            --resource-group excelmcp-observability `
            --workspace-name excelmcp-logs `
            --query customerId `
            --output tsv `
            --only-show-errors
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($workspaceId)) {
            throw "Unable to resolve the Log Analytics workspace."
          }

          $agentDirectory = Join-Path $env:RUNNER_TEMP "usage-analytics-agent"
          New-Item -ItemType Directory -Path $agentDirectory | Out-Null
          ./scripts/Update-UsageAnalytics.ps1 `
            -WorkspaceId $workspaceId `
            -OutputPath (Join-Path $agentDirectory "analytics.json")

      - name: End Azure session
        if: always()
        run: az logout

      - name: Upload sanitized aggregates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: usage-analytics-input
          path: ${{ runner.temp }}/usage-analytics-agent/analytics.json
          if-no-files-found: error
          retention-days: 1

  interpret:
    name: Interpret and validate report
    needs: collect
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download sanitized aggregates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: usage-analytics-input
          path: ${{ runner.temp }}/usage-analytics-agent

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7

      - name: Install Copilot CLI
        run: npm install --global @github/copilot@1.0.93

      - name: Interpret and validate sanitized aggregates
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:COPILOT_GITHUB_TOKEN)) {
            throw "COPILOT_GITHUB_TOKEN is not configured."
          }
          $agentDirectory = Join-Path $env:RUNNER_TEMP "usage-analytics-agent"
          ./scripts/Invoke-UsageAnalyticsReport.ps1 `
            -AnalyticsPath (Join-Path $agentDirectory "analytics.json") `
            -InterpretationPath (Join-Path $agentDirectory "interpretation.md") `
            -OutputPath (Join-Path $agentDirectory "usage-analytics.json")

      - name: Upload validated report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: usage-analytics-report
          path: ${{ runner.temp }}/usage-analytics-agent/usage-analytics.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated report
    if: github.event_name == 'schedule' || inputs.publish == true
    needs: interpret
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download validated report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: usage-analytics-report
          path: ${{ runner.temp }}/usage-analytics-report

      - name: Persist to analytics-data branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/Persist-UsageAnalytics.ps1 `
            -Repository '${{ github.repository }}' `
            -Branch 'analytics-data' `
            -ReportPath (Join-Path $env:RUNNER_TEMP 'usage-analytics-report/usage-analytics.json') `
            -RemotePath '.github/usage-analytics.json' `
            -CommitSha '${{ github.sha }}' `
            -TempPath $env:RUNNER_TEMP
