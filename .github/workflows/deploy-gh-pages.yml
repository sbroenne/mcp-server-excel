name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'gh-pages/**'
      - 'FEATURES.md'
      - 'docs/features/**'
      - 'docs/guides/**'
      - 'skills/shared/**'
      - 'CHANGELOG.md'
      - 'PRIVACY.md'
      - 'docs/INSTALLATION.md'
      - 'docs/INSTALLATION-MCP-SERVER.md'
      - 'docs/INSTALLATION-CLI.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/USE-CASES.md'
      - 'docs/CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'src/ExcelMcp.McpServer/README.md'
      - 'src/ExcelMcp.CLI/README.md'
      - 'skills/README.md'
      - '.github/workflows/deploy-gh-pages.yml'
      - '.github/star-history.csv'
      - '.github/usage-analytics.json'
      - 'scripts/Restore-UsageAnalytics.ps1'
      - 'scripts/Update-StarHistory.ps1'
      - 'scripts/Restore-StarHistory.ps1'
  schedule:
    # After star-history.yml (02:17 UTC) so the site renders the same day's snapshot.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Read-only: persisting the star history now lives in star-history.yml, so
    # this job - which installs third-party Python packages - no longer needs
    # write access to the repository.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      indexnow_urls: ${{ steps.indexnow-urls.outputs.urls }}
    env:
      STAR_HISTORY_BRANCH: star-history-data
      STAR_HISTORY_PATH: .github/star-history.csv
      USAGE_ANALYTICS_BRANCH: analytics-data
      USAGE_ANALYTICS_PATH: .github/usage-analytics.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # hooks.py derives each sitemap <lastmod> from `git log`, so the full
          # history is required. A shallow clone would date every page to the
          # tip commit; audit_site.py fails the build if it detects that.
          fetch-depth: 0

      - name: Restore persisted star history
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/Restore-StarHistory.ps1 `
            -Repository '${{ github.repository }}' `
            -Branch $env:STAR_HISTORY_BRANCH `
            -HistoryPath $env:STAR_HISTORY_PATH `
            -RemotePath $env:STAR_HISTORY_PATH

      - name: Restore persisted usage analytics
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/Restore-UsageAnalytics.ps1 `
            -Repository '${{ github.repository }}' `
            -Branch $env:USAGE_ANALYTICS_BRANCH `
            -ReportPath $env:USAGE_ANALYTICS_PATH `
            -RemotePath $env:USAGE_ANALYTICS_PATH

      - name: Render star history chart
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Repository metadata remains public even though timestamped stargazers are restricted.
          $countText = gh api "repos/${{ github.repository }}" --jq ".stargazers_count"
          $count = 0

          if ($LASTEXITCODE -ne 0 -or -not [int]::TryParse($countText, [ref]$count)) {
            throw "GitHub did not return a valid public stargazers_count."
          }

          # Local render only - the durable snapshot is written by star-history.yml.
          ./scripts/Update-StarHistory.ps1 `
            -Repository '${{ github.repository }}' `
            -HistoryPath $env:STAR_HISTORY_PATH `
            -CurrentCount $count `
            -OutputPath './gh-pages/docs/assets/images/star-history.svg'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: gh-pages/requirements.txt

      - name: Install dependencies
        run: pip install -r gh-pages/requirements.txt

      - name: Build with MkDocs
        working-directory: gh-pages
        run: mkdocs build --strict --clean

      - name: Audit built site
        working-directory: gh-pages
        run: python audit_site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'gh-pages/_site'

      - name: Collect IndexNow URLs
        id: indexnow-urls
        run: |
          # Get list of all HTML pages from the built site (excluding 404.html which should not be indexed)
          cd gh-pages/_site
          URLS=$(find . -name "*.html" -type f ! -name "404.html" | sed 's|^\./||' | sed 's|index\.html$||' | sed 's|^|https://excelmcpserver.dev/|' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "urls=$URLS" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify IndexNow (Bing/Yandex)
        env:
          URLS: ${{ needs.build.outputs.indexnow_urls }}
        run: |
          curl -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"excelmcpserver.dev\",
              \"key\": \"2049c837880704706739672b0ca752f9\",
              \"keyLocation\": \"https://excelmcpserver.dev/2049c837880704706739672b0ca752f9.txt\",
              \"urlList\": $URLS
            }" \
            --fail-with-body || echo "IndexNow notification failed (non-critical)"
