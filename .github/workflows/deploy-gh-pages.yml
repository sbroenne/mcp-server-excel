name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'gh-pages/**'
      - 'FEATURES.md'
      - 'CHANGELOG.md'
      - 'PRIVACY.md'
      - 'docs/INSTALLATION.md'
      - 'docs/INSTALLATION-MCP-SERVER.md'
      - 'docs/INSTALLATION-CLI.md'
      - 'docs/CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'src/ExcelMcp.McpServer/README.md'
      - 'src/ExcelMcp.CLI/README.md'
      - 'skills/README.md'
      - '.github/workflows/deploy-gh-pages.yml'
      - '.github/star-history.csv'
      - 'scripts/Update-StarHistory.ps1'
      - 'scripts/Test-StarHistory.ps1'
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      indexnow_urls: ${{ steps.indexnow-urls.outputs.urls }}
    env:
      STAR_HISTORY_BRANCH: star-history-data
      STAR_HISTORY_PATH: .github/star-history.csv
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test star history generator
        shell: pwsh
        run: ./scripts/Test-StarHistory.ps1

      - name: Restore persisted star history
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apiPath = "repos/${{ github.repository }}/contents/$env:STAR_HISTORY_PATH" +
            "?ref=$env:STAR_HISTORY_BRANCH"
          $response = & gh api $apiPath 2>&1
          $responseText = $response -join "`n"

          if ($LASTEXITCODE -eq 0) {
            $state = $responseText | ConvertFrom-Json
            $content = [Convert]::FromBase64String(($state.content -replace "\s", ""))
            [IO.File]::WriteAllBytes($env:STAR_HISTORY_PATH, $content)
            Write-Host "Restored aggregate snapshots from $env:STAR_HISTORY_BRANCH."
          }
          elseif ($responseText -match "HTTP 404") {
            Write-Host "No persisted branch exists yet; using the exact aggregate bootstrap."
          }
          else {
            throw "Unable to restore persisted star history: $responseText"
          }

      - name: Record current public star count and generate chart
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Repository metadata remains public even though timestamped stargazers are restricted.
          $countText = gh api "repos/${{ github.repository }}" --jq ".stargazers_count"
          $count = 0

          if ($LASTEXITCODE -ne 0 -or -not [int]::TryParse($countText, [ref]$count)) {
            throw "GitHub did not return a valid public stargazers_count."
          }

          ./scripts/Update-StarHistory.ps1 `
            -Repository '${{ github.repository }}' `
            -HistoryPath $env:STAR_HISTORY_PATH `
            -CurrentCount $count `
            -OutputPath './gh-pages/docs/assets/images/star-history.svg'

      - name: Persist daily aggregate snapshot
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repository = '${{ github.repository }}'
          $refApi = "repos/$repository/git/ref/heads/$env:STAR_HISTORY_BRANCH"
          $refResponse = & gh api $refApi 2>&1
          $refResponseText = $refResponse -join "`n"

          if ($LASTEXITCODE -ne 0) {
            if ($refResponseText -notmatch "HTTP 404") {
              throw "Unable to inspect $env:STAR_HISTORY_BRANCH: $refResponseText"
            }

            gh api --silent --method POST "repos/$repository/git/refs" `
              -f ref="refs/heads/$env:STAR_HISTORY_BRANCH" `
              -f sha='${{ github.sha }}'

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create $env:STAR_HISTORY_BRANCH."
            }
          }

          $contentApi = "repos/$repository/contents/$env:STAR_HISTORY_PATH" +
            "?ref=$env:STAR_HISTORY_BRANCH"
          $existingResponse = & gh api $contentApi 2>&1
          $existingExitCode = $LASTEXITCODE

          if ($existingExitCode -ne 0) {
            throw "Unable to read the persisted aggregate file: $($existingResponse -join "`n")"
          }

          $existing = ($existingResponse -join "`n") | ConvertFrom-Json
          $existingText = [Text.Encoding]::UTF8.GetString(
            [Convert]::FromBase64String(($existing.content -replace "\s", "")))
          $updatedText = [IO.File]::ReadAllText($env:STAR_HISTORY_PATH)

          if ($existingText -eq $updatedText) {
            Write-Host "Today's aggregate snapshot is already current."
            exit 0
          }

          $payload = @{
            message = "chore: snapshot star history $([DateTime]::UtcNow.ToString('yyyy-MM-dd'))"
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($updatedText))
            branch = $env:STAR_HISTORY_BRANCH
            sha = $existing.sha
          } | ConvertTo-Json
          $payloadPath = Join-Path $env:RUNNER_TEMP "star-history-update.json"
          [IO.File]::WriteAllText($payloadPath, $payload)

          gh api --silent --method PUT `
            "repos/$repository/contents/$env:STAR_HISTORY_PATH" `
            --input $payloadPath

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to persist the daily aggregate snapshot."
          }

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: gh-pages/requirements.txt

      - name: Install dependencies
        run: pip install -r gh-pages/requirements.txt

      - name: Build with MkDocs
        working-directory: gh-pages
        run: mkdocs build --strict --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'gh-pages/_site'

      - name: Collect IndexNow URLs
        id: indexnow-urls
        run: |
          # Get list of all HTML pages from the built site (excluding 404.html which should not be indexed)
          cd gh-pages/_site
          URLS=$(find . -name "*.html" -type f ! -name "404.html" | sed 's|^\./||' | sed 's|index\.html$||' | sed 's|^|https://excelmcpserver.dev/|' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "urls=$URLS" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify IndexNow (Bing/Yandex)
        env:
          URLS: ${{ needs.build.outputs.indexnow_urls }}
        run: |
          curl -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"excelmcpserver.dev\",
              \"key\": \"2049c837880704706739672b0ca752f9\",
              \"keyLocation\": \"https://excelmcpserver.dev/2049c837880704706739672b0ca752f9.txt\",
              \"urlList\": $URLS
            }" \
            --fail-with-body || echo "IndexNow notification failed (non-critical)"
