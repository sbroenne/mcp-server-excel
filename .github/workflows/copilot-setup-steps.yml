name: '[Copilot] Setup Steps'

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/Install-CopilotPonytailReview.ps1
      - scripts/Install-AdoBuildTools.ps1
      - scripts/Import-AdoDefinitions.ps1
      - global.json
      - Directory.Packages.props
      - '**/*.csproj'
      - '**/package-lock.json'
      - gh-pages/requirements.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/Install-CopilotPonytailReview.ps1
      - scripts/Install-AdoBuildTools.ps1
      - scripts/Import-AdoDefinitions.ps1
      - global.json
      - Directory.Packages.props
      - '**/*.csproj'
      - '**/package-lock.json'
      - gh-pages/requirements.txt

jobs:
  copilot-setup-steps:
    runs-on: windows-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Ponytail review skill
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\Install-CopilotPonytailReview.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
            npm-packages/shared/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: gh-pages/requirements.txt

      - name: Restore .NET dependencies
        run: dotnet restore Sbroenne.ExcelMcp.sln

      - name: Install Microsoft ADO build tools
        shell: pwsh
        run: .\scripts\Install-AdoBuildTools.ps1

      - name: Install repository tooling
        shell: pwsh
        run: npm ci

      - name: Install VS Code extension dependencies
        working-directory: vscode-extension
        shell: pwsh
        run: npm ci

      - name: Install documentation dependencies
        run: python -m pip install -r gh-pages/requirements.txt

      - name: Install shared npm tooling
        working-directory: npm-packages/shared
        shell: pwsh
        run: npm ci

      - name: Verify setup tools and Excel-free boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet --version
          node --version
          python --version
          Write-Output 'Hosted setup complete. Desktop Excel is unavailable; no COM behavior was verified. LLM evaluations and their dependencies remain on demand.'
