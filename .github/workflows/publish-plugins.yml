name: Publish Plugins

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string
      plugin_artifact:
        required: true
        type: string
    outputs:
      status:
        value: ${{ jobs.publish.outputs.status }}
      published_tag:
        value: ${{ jobs.publish.outputs.published_tag }}
      published_commit:
        value: ${{ jobs.publish.outputs.published_commit }}
      changed_plugins:
        value: ${{ jobs.publish.outputs.changed_plugins }}
      handoff:
        value: ${{ jobs.publish.outputs.handoff }}
    secrets:
      PLUGINS_REPO_TOKEN:
        required: true
      COPILOT_GITHUB_TOKEN:
        required: false
      AWESOME_COPILOT_PR_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing source release tag to repair (never current main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-plugins
  cancel-in-progress: false

env:
  PUBLISHED_REPO: sbroenne/mcp-server-excel-plugins

jobs:
  resolve:
    name: Resolve Exact Release
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify tag, commit, version and published assets
        id: release
        env:
          TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.release_commit }}
          EXPECTED_VERSION: ${{ inputs.release_version }}
          GH_TOKEN: ${{ github.token }}
          PLUGINS_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag"; exit 1; }
          [ -n "$PLUGINS_TOKEN" ] || { echo "::error::PLUGINS_REPO_TOKEN is required"; exit 1; }
          COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          VERSION="${TAG#v}"
          [ -z "$EXPECTED_COMMIT" ] || [ "$COMMIT" = "$EXPECTED_COMMIT" ]
          [ -z "$EXPECTED_VERSION" ] || [ "$VERSION" = "$EXPECTED_VERSION" ]
          gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -Fx false
          gh release view "$TAG" --json assets > release-assets.json
          for asset in "ExcelMcp-CLI-$VERSION-windows.zip" "ExcelMcp-MCP-Server-$VERSION-windows.zip" SHA256SUMS; do
            jq -e --arg name "$asset" '.assets | any(.name == $name)' release-assets.json >/dev/null
          done
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          GH_TOKEN="$PLUGINS_TOKEN" gh api "repos/$PUBLISHED_REPO" --silent

  publish:
    name: Publish Exact Release Plugins
    needs: resolve
    runs-on: windows-latest
    outputs:
      status: ${{ steps.publication.outputs.status }}
      published_tag: ${{ steps.publication.outputs.published_tag }}
      published_commit: ${{ steps.publication.outputs.published_commit }}
      changed_plugins: ${{ steps.publication.outputs.changed_plugins }}
      handoff: ${{ steps.publication.outputs.handoff }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - name: Checkout current publication guards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Checkout exact released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Download already prepared release plugins
        if: inputs.plugin_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.plugin_artifact }}
          path: built-plugins
      - name: Setup .NET for manual repair
        if: inputs.plugin_artifact == ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json
      - name: Recover or rebuild only the requested release
        if: inputs.plugin_artifact == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          $payload = "excel-plugins-v$env:VERSION.zip"
          if ($payload -in $assets.assets.name) {
            gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern $payload --pattern SHA256SUMS --dir .
            $checksumLines = @(Get-Content SHA256SUMS | Where-Object {
              $_ -match ('^[a-fA-F0-9]{64}\s+\*?' + [regex]::Escape($payload) + '$')
            })
            if ($checksumLines.Count -ne 1) { throw 'Exactly one plugin payload checksum is required.' }
            $expectedHash = ($checksumLines[0] -split '\s+', 2)[0]
            if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash -ne $expectedHash) {
              throw 'Plugin payload checksum mismatch.'
            }
            Expand-Archive -LiteralPath $payload -DestinationPath built-plugins
          } else {
            # Older releases predate the prepared payload. Build their exact tag.
            Set-Location source
            dotnet build Sbroenne.ExcelMcp.sln -c Release "-p:Version=$env:VERSION"
            $generator = Get-Command .\scripts\Build-AgentSkills.ps1
            if ($generator.Parameters.ContainsKey('GenerateOnly')) {
              & $generator -GenerateOnly -Version $env:VERSION
            } else {
              & $generator -PopulateReferences
            }
            .\scripts\Build-Plugins.ps1 -Version $env:VERSION -OutputDir ..\built-plugins
          }
      - name: Setup Python for Agent Skills validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate prepared skills
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check `
            "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          foreach ($plugin in @('excel-mcp', 'excel-cli')) {
            $root = Join-Path 'built-plugins' "$plugin\skills"
            $skills = @(
              (Join-Path $root "$plugin-report-formatting")
              (Join-Path $root $plugin)
            ) | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'SKILL.md') -PathType Leaf }
            if (@($skills).Count -ne 1) {
              throw "$plugin must contain exactly one recognized current or immutable legacy skill."
            }
            skills-ref validate (@($skills)[0])
          }
      - name: Checkout output-only published repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.PUBLISHED_REPO }}
          token: ${{ secrets.PLUGINS_REPO_TOKEN }}
          path: published-repo
          fetch-depth: 0
      - name: Guard, synchronize and publish
        id: publication
        shell: pwsh
        env:
          MANUAL_REPAIR: ${{ github.event_name == 'workflow_dispatch' && inputs.plugin_artifact == '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          .\automation\scripts\Publish-PreparedPlugins.ps1 `
            -SourceDirectory source -PublishedRepoDirectory published-repo -BuiltPluginsDirectory built-plugins `
            -Version $env:VERSION -SourceCommit $env:SOURCE_COMMIT -ManualRepair:($env:MANUAL_REPAIR -eq 'true')

  update-awesome-copilot:
    name: Optional Awesome Copilot Update
    needs: publish
    if: needs.publish.outputs.handoff == 'true' && vars.AWESOME_COPILOT_UPDATES_ENABLED == 'true'
    uses: ./.github/workflows/update-awesome-copilot.lock.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      published_tag: ${{ needs.publish.outputs.published_tag }}
      preview: false
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      AWESOME_COPILOT_PR_TOKEN: ${{ secrets.AWESOME_COPILOT_PR_TOKEN }}
