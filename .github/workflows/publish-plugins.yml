name: Publish Plugins

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string
      plugin_artifact:
        required: true
        type: string
    secrets:
      PLUGINS_REPO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing source release tag to repair (never current main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-plugins
  cancel-in-progress: false

env:
  PUBLISHED_REPO: sbroenne/mcp-server-excel-plugins

jobs:
  resolve:
    name: Resolve Exact Release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag, commit, version and published assets
        id: release
        env:
          TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.release_commit }}
          EXPECTED_VERSION: ${{ inputs.release_version }}
          GH_TOKEN: ${{ github.token }}
          PLUGINS_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag"; exit 1; }
          [ -n "$PLUGINS_TOKEN" ] || { echo "::error::PLUGINS_REPO_TOKEN is required"; exit 1; }
          COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          VERSION="${TAG#v}"
          [ -z "$EXPECTED_COMMIT" ] || [ "$COMMIT" = "$EXPECTED_COMMIT" ]
          [ -z "$EXPECTED_VERSION" ] || [ "$VERSION" = "$EXPECTED_VERSION" ]
          gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -Fx false
          gh release view "$TAG" --json assets > release-assets.json
          for asset in "ExcelMcp-CLI-$VERSION-windows.zip" "ExcelMcp-MCP-Server-$VERSION-windows.zip" SHA256SUMS; do
            jq -e --arg name "$asset" '.assets | any(.name == $name)' release-assets.json >/dev/null
          done
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          GH_TOKEN="$PLUGINS_TOKEN" gh api "repos/$PUBLISHED_REPO" --silent

  publish:
    name: Publish Exact Release Plugins
    needs: resolve
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - name: Checkout exact released source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
      - name: Download already prepared release plugins
        if: inputs.plugin_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.plugin_artifact }}
          path: built-plugins
      - name: Setup .NET for manual repair
        if: inputs.plugin_artifact == ''
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: source/global.json
      - name: Recover or rebuild only the requested release
        if: inputs.plugin_artifact == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          $payload = "excel-plugins-v$env:VERSION.zip"
          if ($payload -in $assets.assets.name) {
            gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern $payload --pattern SHA256SUMS --dir .
            $checksumLines = @(Get-Content SHA256SUMS | Where-Object {
              $_ -match ('^[a-fA-F0-9]{64}\s+\*?' + [regex]::Escape($payload) + '$')
            })
            if ($checksumLines.Count -ne 1) { throw 'Exactly one plugin payload checksum is required.' }
            $expectedHash = ($checksumLines[0] -split '\s+', 2)[0]
            if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash -ne $expectedHash) {
              throw 'Plugin payload checksum mismatch.'
            }
            Expand-Archive -LiteralPath $payload -DestinationPath built-plugins
          } else {
            # Older releases predate the prepared payload. Build their exact tag.
            Set-Location source
            dotnet build Sbroenne.ExcelMcp.sln -c Release "-p:Version=$env:VERSION"
            $generator = Get-Command .\scripts\Build-AgentSkills.ps1
            if ($generator.Parameters.ContainsKey('GenerateOnly')) {
              & $generator -GenerateOnly -Version $env:VERSION
            } else {
              & $generator -PopulateReferences
            }
            .\scripts\Build-Plugins.ps1 -Version $env:VERSION -OutputDir ..\built-plugins
          }
      - name: Setup Python for Agent Skills validation
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate prepared skills
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check `
            "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          skills-ref validate built-plugins\excel-mcp\skills\excel-mcp
          skills-ref validate built-plugins\excel-cli\skills\excel-cli
      - name: Checkout output-only published repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PUBLISHED_REPO }}
          token: ${{ secrets.PLUGINS_REPO_TOKEN }}
          path: published-repo
          fetch-depth: 0
      - name: Guard, synchronize and publish
        shell: pwsh
        env:
          MANUAL_REPAIR: ${{ github.event_name == 'workflow_dispatch' && inputs.plugin_artifact == '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifestPath = 'published-repo\.github\plugin\marketplace.json'
          if (-not (Test-Path $manifestPath)) { $manifestPath = 'published-repo\marketplace.json' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $versions = @(if ($manifest.version) { $manifest.version } else { $manifest.plugins.version | Select-Object -Unique })
          if ($versions.Count -ne 1 -or $versions[0] -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Published marketplace must have one valid version.'
          }
          $current = $versions[0]
          if ([version]$current -gt [version]$env:VERSION) { throw 'Downgrade publish blocked.' }
          $tagExists = @(git -C published-repo tag --list $env:TAG).Count -gt 0
          if ($tagExists -and $current -ne $env:VERSION) { throw 'Existing tag conflicts with marketplace version.' }
          foreach ($name in @('excel-cli', 'excel-mcp')) {
            $root = Join-Path built-plugins $name
            $plugin = Get-Content (Join-Path $root 'plugin.json') -Raw | ConvertFrom-Json
            if ($plugin.version -ne $env:VERSION -or $plugin.name -ne $name) { throw "Wrong identity in $name payload." }
            foreach ($stamp in @('version.txt', "skills\$name\VERSION")) {
              if ((Get-Content (Join-Path $root $stamp) -Raw).Trim() -ne $env:VERSION) { throw "Wrong $stamp in $name." }
            }
            $runtimeFiles = @(Get-ChildItem $root -Recurse -File | Where-Object {
              $_.Extension -in @('.exe', '.dll', '.pdb') -or $_.Name -match '\.(deps|runtimeconfig)\.json$'
            })
            if ($runtimeFiles.Count) { throw "Plugin $name contains bundled runtime files." }
          }
          if ($tagExists -and $current -eq $env:VERSION -and $env:MANUAL_REPAIR -ne 'true') {
            "Plugins already published for $env:TAG." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          .\source\scripts\Sync-PublishedPluginRepo.ps1 -PublishedRepoDir published-repo -BuiltPluginsDir built-plugins -Version $env:VERSION
          git -C published-repo config user.name 'ExcelMcp Publisher Bot'
          git -C published-repo config user.email 'excelmcp-publisher[bot]@users.noreply.github.com'
          git -C published-repo add -A
          $changes = @(git -C published-repo diff --cached --name-only)
          if ($changes.Count) {
            git -C published-repo commit -m "Release $env:TAG" -m "Source release commit: $env:SOURCE_COMMIT"
            git -C published-repo push origin HEAD:main
          }
          if (-not $tagExists) {
            git -C published-repo tag -a $env:TAG -m "Release $env:TAG"
            git -C published-repo push origin $env:TAG
          }
          "Plugins synchronized for $env:TAG from $env:SOURCE_COMMIT." >> $env:GITHUB_STEP_SUMMARY
