name: '[Excel Runner] Maintenance'

on:
  schedule:
    - cron: '17 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: excel-runner-control
  queue: max
  cancel-in-progress: false

jobs:
  patch:
    if: vars.EXCEL_RUNNER_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 195
    environment: excel-runner-control
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.EXCEL_RUNNER_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.EXCEL_RUNNER_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.EXCEL_RUNNER_AZURE_SUBSCRIPTION_ID }}
      - name: Patch Windows and Excel, restart and qualify the desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Invoke-ExcelRunnerMaintenance.ps1 -ReportPath maintenance-results/report.json -Confirm:$false
      - name: Keep the maintenance and recovery report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: excel-runner-maintenance-${{ github.run_id }}
          path: maintenance-results/report.json
          if-no-files-found: warn
          retention-days: 90
