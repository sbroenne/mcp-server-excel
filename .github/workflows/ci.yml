# CI Gate — the authoritative status checks for pull requests.
#
# Both required checks ALWAYS report on every PR to `main`, so they can be
# safely marked as required status checks without the "required check never
# runs on path-filtered PRs" deadlock.
#
# `Docs Site` always reports and builds changed website inputs. `CI Gate` verifies that
# change detection and all selected jobs succeeded. Main/manual runs are complete.
# The Excel-dependent gates — the CLI workflow, stale-build graceful-save
# acceptance, and MCP workflow scenarios — are intentionally NOT run here:
# GitHub-hosted `windows-latest` runners do not have Microsoft Excel installed.
# Selected Excel behavior and affected acceptance stages remain local checks.

name: CI Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the required check visible even when website work was not selected.
  docs:
    name: Docs Site
    needs: changes
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Verify documentation selection
        shell: bash
        env:
          DETECTION: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.docs }}
        run: |
          [ "$DETECTION" = success ] || { echo "::error::Validation selection failed."; exit 1; }
          case "$SELECTED" in
            true) echo 'Website inputs changed.' ;;
            false) echo 'Website work was not selected.' ;;
            *) echo "::error::Invalid website selection."; exit 1 ;;
          esac
      - name: Checkout
        if: needs.changes.outputs.docs == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # hooks.py derives each sitemap <lastmod> from `git log`, so the full
          # history is required. A shallow clone would date every page to the
          # tip commit; audit_site.py fails the build if it detects that.
          fetch-depth: 0

      - name: Setup Python
        if: needs.changes.outputs.docs == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: gh-pages/requirements.txt

      - name: Install dependencies
        if: needs.changes.outputs.docs == 'true'
        run: pip install -r gh-pages/requirements.txt

      - name: Unit test site generator
        if: needs.changes.outputs.docs == 'true'
        working-directory: gh-pages
        run: python -m unittest discover -s tests

      - name: Check sample data and build scripts
        if: needs.changes.outputs.docs == 'true'
        run: python -m unittest discover -s samples/world-bank-dashboard -p "test_*.py"

      - name: Build with MkDocs
        if: needs.changes.outputs.docs == 'true'
        working-directory: gh-pages
        run: mkdocs build --strict --clean

      - name: Audit built site
        if: needs.changes.outputs.docs == 'true'
        working-directory: gh-pages
        run: python audit_site.py

      # Guards against the deploy workflow's hand-written paths: filter drifting
      # from the canonical sources listed in sitegen/sources.py, which would publish a
      # silently stale site until the nightly cron caught up.
      - name: Verify deploy path filter covers every mirrored source
        if: needs.changes.outputs.docs == 'true'
        working-directory: gh-pages
        run: python check_deploy_paths.py

  changes:
    name: Select validation
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      tests: ${{ steps.select.outputs.tests }}
      packages: ${{ steps.select.outputs.packages }}
      package_build: ${{ steps.select.outputs.package_build }}
      npm: ${{ steps.select.outputs.npm }}
      lockfiles: ${{ steps.select.outputs.lockfiles }}
      source_checks_group: ${{ steps.select.outputs.source_checks_group }}
      docs: ${{ steps.select.outputs.docs }}
      documentation_counts: ${{ steps.select.outputs.documentation_counts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup .NET for selection
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Select changed inputs
        id: select
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./scripts/Get-CiValidationPlan.ps1 -BaseRef $env:BASE_REF -HeadRef $env:HEAD_REF `
            -Full:($env:EVENT -ne 'pull_request') -OutputPath artifacts/ci-plan.json
      - name: Share selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-validation-plan
          path: artifacts/ci-plan.json
          if-no-files-found: error

  tests:
    name: Excel-free (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-validation-plan
          path: artifacts
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.*', 'NuGet.Config', '**/*.csproj', '**/*.props', '**/*.targets') }}
      - name: Setup Node.js
        if: matrix.group == 'Tooling'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      # Separate checkouts keep rebuild/process regressions from racing packaging.
      - name: Restore and build selected inputs
        shell: pwsh
        run: |
          ./scripts/Build-CiInputs.ps1 -PlanFile artifacts/ci-plan.json -Group '${{ matrix.group }}'
      - name: Generate complete skill inputs
        if: matrix.group == needs.changes.outputs.source_checks_group && needs.changes.outputs.documentation_counts == 'true'
        shell: pwsh
        run: ./scripts/Build-AgentSkills.ps1 -GenerateOnly
      - name: Selected Excel-free tests
        shell: pwsh
        run: |
          ./scripts/Invoke-ExcelFreeTests.ps1 -Group '${{ matrix.group }}' `
            -PlanFile artifacts/ci-plan.json -ResultsDirectory 'TestResults/${{ matrix.group }}'
      - name: Source correctness checks
        if: matrix.group == needs.changes.outputs.source_checks_group
        shell: pwsh
        run: |
          foreach ($script in @('check-com-leaks','check-workbook-package-access','check-success-flag','check-dynamic-casts')) {
            & "./scripts/$script.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$script failed." }
          }
          $plan = Get-Content artifacts/ci-plan.json -Raw | ConvertFrom-Json
          if ($plan.DocumentationCounts) {
            & ./scripts/check-doc-counts.ps1 -SkipBuild
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed documentation counts are stale.' }
          }
      - name: Verify entry-point builds
        if: matrix.group == needs.changes.outputs.source_checks_group && needs.changes.outputs.documentation_counts == 'true'
        shell: pwsh
        run: |
          & ./src/ExcelMcp.CLI/bin/Release/net10.0-windows/excelcli.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help failed.' }
          if (-not (Test-Path ./src/ExcelMcp.McpServer/bin/Release/net10.0-windows/Sbroenne.ExcelMcp.McpServer.exe)) {
            throw 'MCP Server executable missing.'
          }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: excel-free-${{ matrix.group }}-results
          path: TestResults/${{ matrix.group }}/**/*.trx
          if-no-files-found: error

  packages:
    name: Affected packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-validation-plan
          path: artifacts
      - name: Setup .NET
        if: needs.changes.outputs.package_build == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet downloads
        if: needs.changes.outputs.package_build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.*', 'NuGet.Config', '**/*.csproj', '**/*.props', '**/*.targets') }}
      - name: Setup Node.js
        if: needs.changes.outputs.package_build == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            vscode-extension/package-lock.json
            npm-packages/shared/package-lock.json

      - name: Generate complete skill inputs
        shell: pwsh
        run: ./scripts/Build-AgentSkills.ps1 -GenerateOnly
      - name: Build and verify affected distributable packages
        shell: pwsh
        run: |
          $plan = Get-Content artifacts/ci-plan.json -Raw | ConvertFrom-Json
          $components = @('Cli','Mcp','Extension','Mcpb','Skills','Plugins') | Where-Object { $plan.$_ }
          if (-not $components) { throw 'Selected package job has no components.' }
          ./scripts/Build-ReleasePackages.ps1 -Components $components -SkillsDirectory artifacts/generated-skills `
            -SkipExtensionTests:(-not $plan.ExtensionTests)
          if ($LASTEXITCODE -ne 0) { throw 'Selected package validation failed.' }

  npm:
    name: npm launchers
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: npm-packages/shared/package-lock.json
      - name: npm launcher and packaging tests (MCP + CLI)
        shell: pwsh
        run: |
          npm ci --prefix npm-packages/shared --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "npm test dependency installation failed." }
          npm test --prefix npm-packages/shared
          if ($LASTEXITCODE -ne 0) { throw "npm launcher or packaging tests failed." }

  lockfiles:
    name: npm lockfiles
    needs: changes
    if: needs.changes.outputs.lockfiles == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check lockfile portability
        timeout-minutes: 2
        shell: pwsh
        run: |
          ./scripts/Test-NpmLockfiles.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Lockfile regressions failed.' }
          ./scripts/check-npm-lockfiles.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Lockfile portability failed.' }

  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, tests, packages, npm, lockfiles]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify every selected result
        shell: pwsh
        env:
          DETECTION: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
          PACKAGES: ${{ needs.packages.result }}
          NPM: ${{ needs.npm.result }}
          LOCKFILES: ${{ needs.lockfiles.result }}
          SELECTED_TESTS: ${{ needs.changes.outputs.tests }}
          SELECTED_PACKAGES: ${{ needs.changes.outputs.packages }}
          SELECTED_NPM: ${{ needs.changes.outputs.npm }}
          SELECTED_LOCKFILES: ${{ needs.changes.outputs.lockfiles }}
        run: |
          ./scripts/Test-CiCompletion.ps1 -Detection $env:DETECTION -Tests $env:TESTS `
            -Packages $env:PACKAGES -Npm $env:NPM -Lockfiles $env:LOCKFILES `
            -SelectedTests $env:SELECTED_TESTS -SelectedPackages $env:SELECTED_PACKAGES `
            -SelectedNpm $env:SELECTED_NPM -SelectedLockfiles $env:SELECTED_LOCKFILES
