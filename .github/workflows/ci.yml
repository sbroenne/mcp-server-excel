# CI Gate — the authoritative status checks for pull requests.
#
# Both required checks ALWAYS report on every PR to `main`, so they can be
# safely marked as required status checks without the "required check never
# runs on path-filtered PRs" deadlock.
#
# `Docs Site` builds and audits the MkDocs website. `CI Gate` verifies that
# change detection and all selected jobs succeeded. Main/manual runs are complete.
# GitHub-hosted `windows-latest` runners do not have Microsoft Excel installed.
# All required acceptance stages remain local prerequisites and are
# explicitly attested in the pull request testing checklist.

name: '[CI] Gate'

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The documentation site is the primary distribution channel for this project
  # (README.md is a landing page that links to excelmcpserver.dev), but until
  # this job existed nothing validated it before merge: the Pages workflow only
  # builds on push to `main`, and scripts/pre-commit.ps1 classifies `docs/`,
  # `gh-pages/` and `*.md` as a docs-only fast path that skips almost every
  # gate. A broken --strict build or audit regression therefore surfaced only
  # after merge, on the deploy run. Runs unfiltered like the CI Gate job below
  # so it can safely be a required check.
  docs:
    name: Docs Site
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # hooks.py derives each sitemap <lastmod> from `git log`, so the full
          # history is required. A shallow clone would date every page to the
          # tip commit; audit_site.py fails the build if it detects that.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: gh-pages/requirements.txt

      - name: Install dependencies
        run: pip install -r gh-pages/requirements.txt

      - name: Unit test site generator
        working-directory: gh-pages
        run: python -m unittest discover -s tests

      - name: Check sample data and build scripts
        run: python -m unittest discover -s samples/world-bank-dashboard -p "test_*.py"

      # This source check does not need a finished site.
      - name: Verify deploy path filter covers every mirrored source
        working-directory: gh-pages
        run: python check_deploy_paths.py

      - name: Build with MkDocs
        working-directory: gh-pages
        run: mkdocs build --strict --clean

      - name: Audit built site
        working-directory: gh-pages
        run: python audit_site.py

  changes:
    name: Select validation
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      tests: ${{ steps.select.outputs.tests }}
      build_only: ${{ steps.select.outputs.build_only }}
      documentation_checks_group: ${{ steps.select.outputs.documentation_checks_group }}
      documentation_counts: ${{ steps.select.outputs.documentation_counts }}
      full_solution_build: ${{ steps.select.outputs.full_solution_build }}
      full_solution_build_group: ${{ steps.select.outputs.full_solution_build_group }}
      packages: ${{ steps.select.outputs.packages }}
      npm: ${{ steps.select.outputs.npm }}
      package_skills: ${{ steps.select.outputs.package_skills }}
      package_dotnet: ${{ steps.select.outputs.package_dotnet }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select changed inputs
        id: select
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./scripts/Get-CiValidationPlan.ps1 -BaseRef $env:BASE_REF -HeadRef $env:HEAD_REF `
            -Full:($env:EVENT -ne 'pull_request') -OutputPath artifacts/ci-plan.json
      - name: Share selection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-validation-plan
          path: artifacts/ci-plan.json
          if-no-files-found: error

  tests:
    name: Excel-free (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-validation-plan
          path: artifacts
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.*', 'NuGet.Config', '**/*.csproj', '**/*.props', '**/*.targets') }}
      - name: Setup Node.js
        if: matrix.group == 'Tooling'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Separate checkouts keep rebuild/process regressions from racing packaging.
      - name: Install Microsoft ADO build tools
        shell: pwsh
        run: ./scripts/Install-AdoBuildTools.ps1
      - name: Restore and build selected inputs
        shell: pwsh
        run: |
          ./scripts/Build-CiInputs.ps1 -PlanFile artifacts/ci-plan.json -Group '${{ matrix.group }}'
      - name: Generate complete skill inputs
        if: matrix.group == needs.changes.outputs.documentation_checks_group && needs.changes.outputs.documentation_counts == 'true'
        shell: pwsh
        run: ./scripts/Build-AgentSkills.ps1 -GenerateOnly
      - name: Selected Excel-free tests
        shell: pwsh
        run: |
          ./scripts/Invoke-ExcelFreeTests.ps1 -Group '${{ matrix.group }}' `
            -PlanFile artifacts/ci-plan.json -ResultsDirectory 'TestResults/${{ matrix.group }}'
      - name: Verify entry-point builds
        if: needs.changes.outputs.full_solution_build == 'true' && matrix.group == needs.changes.outputs.full_solution_build_group
        shell: pwsh
        run: |
          & ./src/ExcelMcp.CLI/bin/Release/net10.0-windows/excelcli.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help failed.' }
          if (-not (Test-Path ./src/ExcelMcp.McpServer/bin/Release/net10.0-windows/Sbroenne.ExcelMcp.McpServer.exe)) {
            throw 'MCP Server executable missing.'
          }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: excel-free-${{ matrix.group }}-results
          path: TestResults/${{ matrix.group }}/**/*.trx
          if-no-files-found: error

  build-only:
    name: Build-only changed inputs
    needs: changes
    if: needs.changes.outputs.build_only == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-validation-plan
          path: artifacts
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install Microsoft ADO build tools
        shell: pwsh
        run: ./scripts/Install-AdoBuildTools.ps1
      - name: Restore and build selected inputs
        shell: pwsh
        run: ./build.ps1 build --plan artifacts/ci-plan.json

  packages:
    name: Package checks
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        if: needs.changes.outputs.package_dotnet == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet downloads
        if: needs.changes.outputs.package_dotnet == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.*', 'NuGet.Config', '**/*.csproj', '**/*.props', '**/*.targets') }}
      - name: Install Microsoft ADO build tools
        if: needs.changes.outputs.package_dotnet == 'true'
        shell: pwsh
        run: ./scripts/Install-AdoBuildTools.ps1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            vscode-extension/package-lock.json
            npm-packages/shared/package-lock.json

      - name: Read selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-validation-plan
          path: artifacts
      - name: Generate complete skill inputs
        if: needs.changes.outputs.package_skills == 'true'
        shell: pwsh
        run: ./scripts/Build-AgentSkills.ps1 -GenerateOnly
      - name: Setup Python for skill validation
        if: needs.changes.outputs.package_skills == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install pinned Agent Skills validator
        if: needs.changes.outputs.package_skills == 'true'
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate generated skills before packaging
        if: needs.changes.outputs.package_skills == 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in @('excel-cli', 'excel-cli-report-formatting', 'excel-mcp-report-formatting')) {
            skills-ref validate "artifacts/generated-skills/$name"
          }
      - name: Build and verify distributable packages
        shell: pwsh
        run: |
          . ./scripts/ValidationExecution.ps1
          $plan = Read-ValidationPlan artifacts/ci-plan.json
          if (-not $plan.PackageComponents.Count) { throw 'Package job has no selected components.' }
          $arguments = @{ Components = [string[]]$plan.PackageComponents }
          if (@($plan.PackageComponents | Where-Object { $_ -in @('Extension', 'Plugins') }).Count) {
            $arguments.SkillsDirectory = 'artifacts/generated-skills'
          }
          ./scripts/Build-ReleasePackages.ps1 @arguments

  npm:
    name: npm launchers
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: npm-packages/shared/package-lock.json
      - name: npm launcher and packaging tests (MCP + CLI)
        shell: pwsh
        run: |
          npm ci --prefix npm-packages/shared --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "npm test dependency installation failed." }
          npm test --prefix npm-packages/shared
          if ($LASTEXITCODE -ne 0) { throw "npm launcher or packaging tests failed." }

  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, tests, build-only, packages, npm]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify every selected result
        shell: pwsh
        env:
          DETECTION: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
          BUILD_ONLY: ${{ needs.build-only.result }}
          PACKAGES: ${{ needs.packages.result }}
          NPM: ${{ needs.npm.result }}
          SELECTED_TESTS: ${{ needs.changes.outputs.tests }}
          SELECTED_BUILD_ONLY: ${{ needs.changes.outputs.build_only }}
          SELECTED_PACKAGES: ${{ needs.changes.outputs.packages }}
          SELECTED_NPM: ${{ needs.changes.outputs.npm }}
        run: |
          ./scripts/Test-CiCompletion.ps1 -Detection $env:DETECTION -Tests $env:TESTS `
            -Packages $env:PACKAGES -Npm $env:NPM -BuildOnly $env:BUILD_ONLY `
            -SelectedTests $env:SELECTED_TESTS -SelectedBuildOnly $env:SELECTED_BUILD_ONLY `
            -SelectedPackages $env:SELECTED_PACKAGES -SelectedNpm $env:SELECTED_NPM
