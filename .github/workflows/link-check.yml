name: Link Check

# Weekly link rot check for the published site.
#
# audit_site.py already validates internal structure on every PR, but nothing
# checked that the site's outbound links still resolve. Broken external links
# degrade both the reading experience and search ranking.
#
# Deliberately NOT run on pull requests: external endpoints rate-limit and go
# down for reasons unrelated to the change under review, so this would be a
# flaky required check. It runs on a schedule and files an issue instead.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check links in built site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # hooks.py derives sitemap dates from git history. A shallow checkout
          # makes the strict MkDocs build fail before the link check can run.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: gh-pages/requirements.txt

      - name: Install dependencies
        run: pip install -r gh-pages/requirements.txt

      - name: Build site
        working-directory: gh-pages
        run: mkdocs build --strict --clean

      - name: Configure GitHub API authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf '[hosts."api.github.com"]\nheaders = { Authorization = "Bearer %s" }\n' \
            "$GH_TOKEN" > "$RUNNER_TEMP/lychee-github.toml"

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --root-dir lets root-relative hrefs resolve against the built
          # output, so internal and external links are both covered. It must be
          # an absolute path - lychee rejects relative values.
          #
          # npmjs.com answers automated clients with 403 even when the package
          # exists, so its links can't be checked this way. The MCP Registry
          # API is slow at times, so allow more time before giving up.
          # GitHub's HTML pages can return 503/504 to automated clients. Check
          # our files through raw URLs and exact commits/PRs/issues through
          # the API instead. Missing targets still fail; authentication is
          # scoped to api.github.com and never sent to other hosts.
          args: >-
            --config ${{ runner.temp }}/lychee-github.toml
            --root-dir ${{ github.workspace }}/gh-pages/_site
            --no-progress
            --max-concurrency 4
            --timeout 60
            --accept 200,206,429
            --exclude '^https?://localhost'
            --exclude '^https?://127\.0\.0\.1'
            --exclude 'example\.com'
            --exclude '^https://www\.npmjs\.com/'
            --remap '^https://github\.com/sbroenne/mcp-server-excel/blob/main/(.*)$ https://raw.githubusercontent.com/sbroenne/mcp-server-excel/main/$1'
            --remap '^https://github\.com/sbroenne/mcp-server-excel/commit/([0-9a-f]{40})(?:[?#].*)?$ https://api.github.com/repos/sbroenne/mcp-server-excel/git/commits/$1'
            --remap '^https://github\.com/sbroenne/mcp-server-excel/pull/([0-9]+)(?:[?#].*)?$ https://api.github.com/repos/sbroenne/mcp-server-excel/pulls/$1'
            --remap '^https://github\.com/sbroenne/mcp-server-excel/issues/([0-9]+)(?:[?#].*)?$ https://api.github.com/repos/sbroenne/mcp-server-excel/issues/$1'
            'gh-pages/_site/**/*.html'
          fail: true
          output: lychee-report.md

      - name: Remove temporary authentication
        if: always()
        run: rm -f -- "$RUNNER_TEMP/lychee-github.toml"

      - name: File an issue when links are broken
        if: failure() && steps.lychee.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: "Broken links on excelmcpserver.dev"
          content-filepath: lychee-report.md
          # Only labels that actually exist in this repo - the API rejects
          # unknown label names.
          labels: documentation
