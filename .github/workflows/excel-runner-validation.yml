name: '[Excel Runner] Validation'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  excel:
    if: >-
      vars.EXCEL_RUNNER_ENABLED == 'true' &&
      github.actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: excel-copilot
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify both product entry points with real Excel
        shell: pwsh
        run: ./scripts/Test-E2E.ps1 -ResultsDirectory validation-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: excel-runner-validation-${{ github.run_id }}
          path: validation-results/*.trx
          if-no-files-found: error
