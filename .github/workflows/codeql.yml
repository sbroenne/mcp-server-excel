# GitHub CodeQL Analysis Workflow
# Performs advanced security scanning for code vulnerabilities

name: "CodeQL Advanced Security"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  schedule:
    # Avoid the busy start of the hour.
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Determines which language areas changed so pull_request runs only analyze
  # the relevant CodeQL languages (e.g. a C#-only PR should not also pay for
  # the javascript-typescript/python/actions matrix legs). Push to main,
  # merge_group, schedule, and workflow_dispatch always analyze every language
  # for full security coverage regardless of these filters.
  changes:
    name: Detect changed languages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    outputs:
      csharp: ${{ steps.filter.outputs.csharp }}
      javascript-typescript: ${{ steps.filter.outputs['javascript-typescript'] }}
      python: ${{ steps.filter.outputs.python }}
      actions: ${{ steps.filter.outputs.actions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            csharp:
              - 'src/**'
              - 'tests/**'
              - '**/*.csproj'
              - '**/*.sln'
              - 'global.json'
              - 'Directory.Build.*'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
            javascript-typescript:
              - 'vscode-extension/**'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
            python:
              - 'llm-tests/**'
              - 'gh-pages/**/*.py'
              - 'videos/**/*.py'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
            actions:
              - '.github/workflows/**'
              - '.github/codeql/**'

  analyze:
    name: Analyze Code with CodeQL (${{ matrix.language }})
    needs: [ changes ]
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || needs.changes.outputs[matrix.language] == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Trace the build so source-generated CLI, MCP, and Service code is scanned.
          - language: csharp
            os: windows-latest
            build-mode: manual
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: python
            os: ubuntu-latest
            build-mode: none
          - language: actions
            os: ubuntu-latest
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Initialize CodeQL
      uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Restore dependencies
      if: matrix.build-mode == 'manual'
      run: dotnet restore Sbroenne.ExcelMcp.sln

    - name: Build solution
      if: matrix.build-mode == 'manual'
      run: dotnet build Sbroenne.ExcelMcp.sln --no-restore --configuration Release --no-incremental -p:UseSharedCompilation=false

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        category: "/language:${{matrix.language}}"
        wait-for-processing: true
