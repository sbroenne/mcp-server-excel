# GitHub CodeQL Analysis Workflow
# Performs advanced security scanning for code vulnerabilities

name: "CodeQL Advanced Security"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  schedule:
    # Avoid the busy start of the hour.
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Determines which language areas changed so pull_request runs only analyze
  # the relevant CodeQL languages (e.g. a C#-only PR should not also pay for
  # the javascript-typescript/python/actions matrix legs). Push to main,
  # merge_group, schedule, and workflow_dispatch always analyze every language
  # for full security coverage regardless of these filters.
  changes:
    name: Detect changed languages
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.codeql_matrix }}
      has-any: ${{ steps.select.outputs.codeql }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed language inputs
        id: select
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./scripts/Get-CiValidationPlan.ps1 -BaseRef $env:BASE_REF -HeadRef $env:HEAD_REF `
            -Full:($env:EVENT -ne 'pull_request') -OutputPath artifacts/codeql-plan.json

  analyze:
    name: Analyze Code with CodeQL (${{ matrix.language }})
    needs: [ changes ]
    if: ${{ needs.changes.outputs.has-any == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Cache NuGet downloads
      if: matrix.language == 'csharp'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.*', 'NuGet.Config', '**/*.csproj', '**/*.props', '**/*.targets') }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Restore dependencies
      if: matrix.build-mode == 'manual'
      run: dotnet restore Sbroenne.ExcelMcp.sln

    - name: Build solution
      if: matrix.build-mode == 'manual'
      run: dotnet build Sbroenne.ExcelMcp.sln --no-restore --configuration Release --no-incremental -p:UseSharedCompilation=false

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        category: "/language:${{matrix.language}}"
        wait-for-processing: true

  completion:
    name: CodeQL Completion
    if: always()
    needs: [changes, analyze]
    runs-on: ubuntu-26.04
    steps:
      - name: Verify detection and all selected analyses
        env:
          DETECTION: ${{ needs.changes.result }}
          HAS_ANY: ${{ needs.changes.outputs.has-any }}
          ANALYSIS: ${{ needs.analyze.result }}
        run: |
          set -euo pipefail
          [ "$DETECTION" = success ] || { echo "::error::Language detection did not succeed."; exit 1; }
          case "$HAS_ANY:$ANALYSIS" in
            true:success) echo 'All selected CodeQL analyses succeeded.' ;;
            false:skipped) echo 'No changed CodeQL languages; intentional analysis skip.' ;;
            *) echo "::error::Unexpected analysis result: $HAS_ANY:$ANALYSIS"; exit 1 ;;
          esac
