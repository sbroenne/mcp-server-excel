name: Release All Components

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        default: patch
        options: [major, minor, patch]
      custom_version:
        description: Custom version (overrides version_bump)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve version at the requested source commit
        id: version
        env:
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Release from main only."; exit 1; }
          VERSION="$CUSTOM_VERSION"
          if [ -z "$VERSION" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            case "$VERSION_BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0";;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0";;
              patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))";;
              *) exit 1;;
            esac
          fi
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::Invalid version."; exit 1; }
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then echo "::error::Tag exists."; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  prepare-release:
    name: Prepare Release Metadata
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Prepare metadata once in this disposable checkout
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/Build-Changelog.ps1 -Version $env:VERSION -Date (Get-Date -AsUTC -Format yyyy-MM-dd)
          git diff --binary --output=release-metadata.patch -- CHANGELOG.md package.json package-lock.json Directory.Build.props mcpb/manifest.json src/ExcelMcp.McpServer/.mcp/server.json vscode-extension/package.json vscode-extension/package-lock.json .changeset
      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: |
            release-metadata.patch
            CHANGELOG.md
            release_notes_body.md
          if-no-files-found: error

  build-packages:
    name: Build and Verify All Packages
    needs: [version, prepare-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: prepared-release
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build exact prepared source and all deliverables
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git apply --check prepared-release/release-metadata.patch
          git apply prepared-release/release-metadata.patch
          dotnet restore Sbroenne.ExcelMcp.sln
          dotnet build Sbroenne.ExcelMcp.sln -c Release --no-restore -p:NuGetAudit=false
          .\scripts\Build-ReleasePackages.ps1 -Version $env:VERSION -OutputDirectory artifacts\release
      - name: Upload verified packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            artifacts/release/*.zip
            artifacts/release/*.vsix
            artifacts/release/nuget/*.nupkg
            artifacts/release/npm/*.tgz
            artifacts/release/mcpb/*.mcpb
            artifacts/release/skills/*.zip
          if-no-files-found: error
      - name: Upload prepared plugin payload
        uses: actions/upload-artifact@v7
        with:
          name: release-plugins
          path: artifacts/release/plugins/
          include-hidden-files: true
          if-no-files-found: error

  create-tag:
    name: Create Git Tag
    needs: [version, prepare-release, build-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.release_commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: prepared-release
      - name: Apply exactly the packaged metadata
        run: |
          git apply --check prepared-release/release-metadata.patch
          git apply prepared-release/release-metadata.patch
      - name: Commit Release Metadata Update
        id: release_commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          [ -n "$GH_TOKEN" ] || { echo "::error::RELEASE_PAT is required for release metadata."; exit 1; }
          git add -A CHANGELOG.md package.json package-lock.json Directory.Build.props \
            mcpb/manifest.json src/ExcelMcp.McpServer/.mcp/server.json \
            vscode-extension/package.json vscode-extension/package-lock.json .changeset
          BASE_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$BASE_SHA" != "$SOURCE_SHA" ]; then
            git fetch origin main
            if [ "$(git rev-parse "$BASE_SHA^")" = "$SOURCE_SHA" ] &&
               [ "$(git rev-parse "$BASE_SHA^{tree}")" = "$(git write-tree)" ]; then
              echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::main advanced. Start a new release from its current tip."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_TREE=$(gh api "repos/$REPO/git/commits/$BASE_SHA" --jq '.tree.sha')
          tree_entries='[]'
          while IFS=$'\t' read -r status path; do
            if [ "$status" = D ]; then
              entry=$(jq -n --arg path "$path" '{path:$path,mode:"100644",type:"blob",sha:null}')
            else
              git show ":$path" | base64 -w0 > blob.b64
              blob_sha=$(gh api "repos/$REPO/git/blobs" --method POST -f encoding=base64 -F content=@blob.b64 --jq '.sha')
              rm blob.b64
              [ "$blob_sha" = "$(git rev-parse ":$path")" ] || { echo "::error::Uploaded metadata differs."; exit 1; }
              entry=$(jq -n --arg path "$path" --arg sha "$blob_sha" '{path:$path,mode:"100644",type:"blob",sha:$sha}')
            fi
            tree_entries=$(jq -c --argjson e "$entry" '. + [$e]' <<< "$tree_entries")
          done < <(git diff --cached --name-status)
          new_tree=$(jq -n --arg base "$BASE_TREE" --argjson tree "$tree_entries" '{base_tree:$base,tree:$tree}' \
            | gh api "repos/$REPO/git/trees" --method POST --input - --jq '.sha')
          new_commit=$(jq -n --arg msg "chore: update release metadata for v${VERSION}" \
            --arg tree "$new_tree" --arg parent "$BASE_SHA" '{message:$msg,tree:$tree,parents:[$parent]}' \
            | gh api "repos/$REPO/git/commits" --method POST --input - --jq '.sha')
          gh api "repos/$REPO/git/refs/heads/main" --method PATCH -f sha="$new_commit" -F force=false >/dev/null
          echo "sha=$new_commit" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$RELEASE_COMMIT" ] || exit 1
            exit 0
          fi
          git tag -a "$TAG" "$RELEASE_COMMIT" -m "Release $TAG"
          git push origin "$TAG"

  create-release:
    name: Create GitHub Release
    needs: [version, prepare-release, create-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: artifacts/release-metadata
      - name: Render notes and release payload checksums
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $template = Get-Content '.github/release-notes-template.md' -Raw
          $body = Get-Content 'artifacts/release-metadata/release_notes_body.md' -Raw
          Set-Content release_notes.md ($template.Replace('{{VERSION}}', $env:VERSION).Replace('{{CHANGELOG}}', $body.Trim())) -NoNewline
          $names = @("ExcelMcp-MCP-Server-$env:VERSION-windows.zip", "ExcelMcp-CLI-$env:VERSION-windows.zip", "excel-plugins-v$env:VERSION.zip")
          $lines = foreach ($name in $names) {
            $hash = (Get-FileHash (Join-Path artifacts $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD SHA256SUMS), $lines, [Text.UTF8Encoding]::new($false))
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.zip artifacts/*.vsix artifacts/mcpb/*.mcpb artifacts/skills/*.zip SHA256SUMS --clobber
          else
            gh release create "$TAG" artifacts/*.zip artifacts/*.vsix artifacts/mcpb/*.mcpb artifacts/skills/*.zip SHA256SUMS \
              --title "ExcelMcp $VERSION" --notes-file release_notes.md
          fi

  publish:
    name: Publish NuGet and npm
    needs: [version, create-tag]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.commit }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Detect npm authentication mode
        id: npm-auth
        shell: pwsh
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          $mode = if ($env:NPM_BOOTSTRAP_TOKEN) { 'token' } else { 'oidc' }
          "mode=$mode" >> $env:GITHUB_OUTPUT
      - if: steps.npm-auth.outputs.mode == 'token'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - if: steps.npm-auth.outputs.mode == 'oidc'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in @('CLI', 'McpServer')) {
            dotnet nuget push "artifacts/nuget/Sbroenne.ExcelMcp.$name.$env:VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
      - name: Publish npm runtimes before launchers
        shell: pwsh
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:NPM_BOOTSTRAP_TOKEN) { $env:NODE_AUTH_TOKEN = $env:NPM_BOOTSTRAP_TOKEN }
          else { Remove-Item Env:NODE_AUTH_TOKEN -ErrorAction SilentlyContinue }
          npm install --global npm@11
          if ($LASTEXITCODE -ne 0) { throw 'npm setup failed.' }
          foreach ($name in @('excelcli-win32-x64', 'mcp-server-excel-win32-x64', 'excelcli', 'mcp-server-excel')) {
            npm view "@sbroenne/$name@$env:VERSION" version --json 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { continue }
            npm publish "./artifacts/npm/sbroenne-$name-$env:VERSION.tgz" --access public
            if ($LASTEXITCODE -ne 0) { throw "npm publication failed for $name." }
          }

  publish-vscode:
    name: Publish VS Code Marketplace
    needs: [version, create-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts
      - uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
        with:
          pat: ${{ secrets.VSCE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: artifacts/excel-mcp-${{ needs.version.outputs.version }}.vsix

  publish-mcp-registry:
    name: MCP Registry
    needs: [version, create-tag, publish]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.commit }}
      - name: Wait for matching NuGet and npm metadata
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $readme = (Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/sbroenne.excelmcp.mcpserver/$version/readme").Content
              $launcher = Invoke-RestMethod "https://registry.npmjs.org/@sbroenne%2fmcp-server-excel/$version"
              $runtime = Invoke-RestMethod "https://registry.npmjs.org/@sbroenne%2fmcp-server-excel-win32-x64/$version"
              if ($readme -notmatch 'mcp-name:\s+io\.github\.sbroenne/mcp-server-excel' -or
                  $launcher.mcpName -ne 'io.github.sbroenne/mcp-server-excel' -or
                  $runtime.version -ne $version) { throw 'Published package metadata is not ready.' }
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Package propagation pending: $_"
              Start-Sleep -Seconds 600
            }
          }
      - name: Publish MCP registry entry
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $arch = if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -eq 'Arm64') { 'arm64' } else { 'amd64' }
          Invoke-WebRequest "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_windows_$arch.tar.gz" -OutFile mcp-publisher.tar.gz
          tar xf mcp-publisher.tar.gz mcp-publisher.exe
          ./mcp-publisher.exe login github-oidc
          Set-Location src/ExcelMcp.McpServer/.mcp
          ../../../mcp-publisher.exe publish --verbose

  publish-plugins:
    needs: [version, create-tag, create-release]
    uses: ./.github/workflows/publish-plugins.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}
      release_commit: ${{ needs.create-tag.outputs.commit }}
      release_version: ${{ needs.version.outputs.version }}
      plugin_artifact: release-plugins
    secrets:
      PLUGINS_REPO_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
