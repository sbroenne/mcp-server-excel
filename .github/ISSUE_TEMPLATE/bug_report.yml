name: Bug report
description: Report an Excel operation or CLI defect.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use private vulnerability reporting instead.
        Remove workbook/customer data, credentials, connection strings, and private paths.
        For MCP transport or assistant setup failures, use the MCP Server issue form.
  - type: dropdown
    id: entry-point
    attributes:
      label: Entry point
      options: ["CLI (excelcli)", "MCP Server", "Both", "Not sure"]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: ExcelMcp version and installation method; Windows and Excel versions; workbook format. For source builds, include the SDK version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal workbook setup and exact CLI commands or MCP tool/action/parameters. Attach only synthetic sample data.
      placeholder: |
        excelcli <command> <action> <flags>
        MCP: powerquery, action=list, with sanitized parameters
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized error
      description: Include returned fields (such as errorCategory and hresult), observed Excel state, any partial changes, and whether the session remains usable. Remove sensitive content. VBA project trust matters for listing or editing modules, not for running an existing macro.
    validations:
      required: true
  - type: textarea
    id: timing
    attributes:
      label: Timing and cancellation (if relevant)
      description: For slow, timed-out, or cancelled calls, include the elapsed time, session open/create timeout, operation timeout if supplied, and any client time limit or cancellation. State whether the macro/query displays a dialog or waits for input. Do not assume a timeout means workbook changes were undone.
