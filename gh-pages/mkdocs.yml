site_name: Excel MCP Server
site_url: https://excelmcpserver.dev/
site_description: >-
  Control Microsoft Excel with natural language through AI assistants like
  GitHub Copilot and Claude. Automate Power Query, DAX, VBA, PivotTables and more.
site_author: Stefan Broenner
copyright: Copyright &copy; 2025&ndash;2026 Stefan Broenner &mdash; MIT License

repo_url: https://github.com/sbroenne/mcp-server-excel
repo_name: sbroenne/mcp-server-excel
edit_uri: edit/main/gh-pages/docs/

docs_dir: docs
site_dir: _site
use_directory_urls: true

# hooks.py mirrors canonical Markdown from all over the repo into the site, but
# MkDocs only watches docs_dir, mkdocs.yml and the hooks themselves. Without
# these entries `mkdocs serve` silently ignores edits to the real sources, so a
# local preview of a FEATURES.md or skills/shared/ change showed nothing.
watch:
  - ../FEATURES.md
  - ../CHANGELOG.md
  - ../SECURITY.md
  - ../PRIVACY.md
  - ../docs
  - ../skills
  - ../src/ExcelMcp.CLI/README.md
  - ../src/ExcelMcp.McpServer/README.md

# Raw generated includes live in gh-pages/_generated/ (outside docs_dir, so
# `mkdocs serve` does not retrigger itself) and are pulled into the thin wrapper
# pages via pymdownx.snippets, which reads them straight from disk.
#
# They used to live in docs/_generated/. Long-lived clones still have that stale
# directory, and without this exclusion MkDocs would silently build every stale
# file as a published page. Keep this even though nothing writes there anymore.
exclude_docs: |
  _generated/

# Many pulled-in source READMEs contain repo-relative links (e.g. ../../FEATURES.md)
# that intentionally point at GitHub, not the site. Keep these as warnings, never
# fatal, so the build stays green.
validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: ignore
  not_found: warn
  nav:
    omitted_files: ignore

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.png
  favicon: favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  # Use local system fonts to avoid render-blocking third-party font requests.
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Guides:
    - Overview: guides/index.md
    - Refresh Power Query: guides/refresh-power-query.md
    - Automate PivotTables: guides/automate-pivottables.md
    - Query the Data Model with DAX: guides/query-data-model-with-dax.md
    - Run VBA macros: guides/run-vba-macros.md
    - COM vs. file parsers: guides/excel-automation-vs-file-parsers.md
  - Features:
    - Overview: features.md
    - Data & analytics: features/data-analytics.md
    - Cells & workbooks: features/cells-workbooks.md
    - Charts & visuals: features/charts-visuals.md
    - Automation & advanced: features/automation-advanced.md
  - Installation:
    - Overview: installation.md
    - MCP Server: installation-mcp-server.md
    - CLI: installation-cli.md
  - MCP Server: mcp-server.md
  - CLI: cli.md
  - Reference:
    - Overview: reference/index.md
    - Working with agents:
      - Key constraints & sequencing: reference/workflows.md
      - Behavioral rules: reference/behavioral-rules.md
      - Anti-patterns: reference/anti-patterns.md
      - Gotchas & known limits: reference/gotchas.md
      - Agent mode in Excel: reference/agent-mode.md
    - Workbooks, sheets & cells:
      - Workbook lifecycle: reference/workbook.md
      - Worksheet operations: reference/worksheet.md
      - Ranges & formatting: reference/range.md
      - Excel Tables: reference/table.md
      - Window management: reference/window.md
    - Data & the model:
      - Power Query: reference/powerquery.md
      - M code syntax: reference/m-code-syntax.md
      - Data Model & DAX: reference/datamodel.md
      - DMV query reference: reference/dmv-reference.md
      - PivotTables: reference/pivottable.md
      - QueryTables: reference/querytable.md
      - What-If Analysis: reference/analysis.md
      - XML maps: reference/xmlmap.md
    - Visuals & output:
      - Charts: reference/chart.md
      - Conditional formatting: reference/conditionalformat.md
      - Slicers: reference/slicer.md
      - Drawing objects: reference/drawing.md
      - Screenshots: reference/screenshot.md
      - Dashboards & reports: reference/dashboard.md
  - Resources:
    - Usage analytics: usage-analytics.md
    - Examples & use cases: use-cases.md
    - Agent Skills: skills.md
    - FAQ: faq.md
    - Troubleshooting: troubleshooting.md
    - Architecture: architecture.md
    - Changelog: changelog.md
    - Contributing: contributing.md
    - Security: security.md
    - Privacy: privacy.md
    - Related projects: related-projects.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - docs
        # gh-pages/, so the `--8<-- "_generated/..."` includes resolve. The
        # generated files sit outside docs_dir on purpose: writing them into it
        # made every build retrigger `mkdocs serve`, looping forever.
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - minify:
      minify_html: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sbroenne/mcp-server-excel
      name: GitHub repository
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCq1ojGTy4-aZz8_CmEPp2aw
      name: YouTube channel
  generator: false

hooks:
  - hooks.py
